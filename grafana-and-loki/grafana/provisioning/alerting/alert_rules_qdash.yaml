      model:
        editorMode: code
        expr: -deriv(qdash_qubit_t1[70d]) * 604800 / avg_over_time(qdash_qubit_t1[70d]) * 100
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 10
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: NoData
    execErrState: Error
    annotations:
      summary: T1 has been degrading by 10% or more per week over the last 10 weeks.
      currentValue: '{{ $values.A.Value }}[%/week]'
