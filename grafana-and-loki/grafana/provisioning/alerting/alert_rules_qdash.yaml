# Alert rules for QDash calibration metrics.
#
# Covers the qdash_qubit_* / qdash_coupling_* series exposed by qdash_exporter.
#
# Notes on the queries:
#
# - Rules that look at the latest value use a [7d] lookback.
#   Calibration data is sparse, so a bare selector usually returns nothing:
#   the default lookback of an instant query is only 5 minutes.
#
# - C1 searches back [90d] for the last update.
#   The last-update time has to stay resolvable well past the 2-week threshold.
#
# - There is one rule per metric rather than one regex covering several.
#   Binary operators drop __name__, so combining metrics into a single rule
#   leaves series that collide on identical label sets.
#
# - A3/A4 add two bool comparisons instead of using `or`.
#   `or` is set union, not logical OR. These alerts must fire when EITHER
#   condition holds, so the bool results are summed and compared with > 0.
#   Use multiplication with > 0.5 for AND.
#
# - "every sample in the window" is written as max_over_time(...[21d]) < limit.
#   A subquery would align its steps to absolute time boundaries and can miss
#   the most recent sample.
#
# - QDash stores frequencies in GHz, so a +-5 MHz drift is written as 0.005.
#   maximum_rabi_frequency is the exception: it is stored in MHz/a.u. (+-5).
apiVersion: 1

# Removing a rule from this file does not remove it from Grafana.
# Its uid has to be listed here to delete it.
deleteRules:
  - orgId: 1
    uid: qdash-a4-bell-fid            # A4 on bell_state_fidelity, no longer alerted on
  - orgId: 1
    uid: qdash-a7-readout-freq-drift  # A7 on readout_frequency, no longer alerted on

groups:
- orgId: 1
  name: qdash_threshold_alerts
  folder: alert_rules
  interval: 5m
  rules:
  - uid: qdash-a1-t1-drop
    title: A1_qdash_t1_drop
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: vmcluster
      model:
        editorMode: code
        expr: (max_over_time(qdash_qubit_t1[21d]) < bool (0.7 * median_over_time(qdash_qubit_t1[49d]))) * (count_over_time(qdash_qubit_t1[21d]) >= bool 3)
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0.5
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: NoData
    execErrState: Error
    annotations:
      summary: T1 has stayed below 70% of its 7-week median for the last 3 weeks.
      currentValue: '{{ $values.A.Value }}'
      resolvedMessage: '{{ $labels.alertname }} has been resolved.'
    labels:
      alert_id: A1
      test_item: 2-1
      category: threshold
      severity: warning
    isPaused: false
