- orgId: 1
  name: qdash_missing_alerts
  folder: alert_rules
  interval: 5m
  rules:
  - uid: qdash-c1-no-calibration
    title: C1_qdash_calibration_missing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: vmcluster
      model:
        editorMode: code
        expr: (time() - max by (chip_id) (tlast_over_time({__name__=~"qdash_(qubit|coupling)_.+"}[90d]))) / 604800
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 2
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: NoData
    execErrState: Error
    annotations:
      summary: No QDash calibration metric has been updated for this chip for 2 weeks or more.
      currentValue: '{{ $values.A.Value }}[weeks]'
      resolvedMessage: '{{ $labels.alertname }} has been resolved.'
    labels:
      alert_id: C1
      test_item: 4-1
      category: missing
      severity: critical
    isPaused: false
